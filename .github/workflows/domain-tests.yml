name: Domain Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run domain tests
        run: |
          find packages apps -name '*.test.mjs' -print0 2>/dev/null | xargs -0 -r -n 1 node --test
